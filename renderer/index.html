<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Tool Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">

    <!-- ── Left Panel: tool list ───────────────────────────────────────── -->
    <div class="left-panel">
      <div class="panel-header">
        <span class="panel-title">Tools</span>
        <div class="panel-header-actions">
          <button class="btn-icon btn-io" id="btn-import-tools" title="导入配置">⬇</button>
          <button class="btn-icon btn-io" id="btn-export-tools" title="导出配置">⬆</button>
          <button class="btn-icon btn-add" id="btn-add-tool" title="添加工具">+</button>
        </div>
      </div>
      <div class="search-bar">
        <input type="search" id="tool-search" placeholder="搜索工具…" autocomplete="off" spellcheck="false">
      </div>
      <div class="tool-list" id="tool-list">
        <!-- Rendered by renderer.js -->
      </div>
    </div>

    <!-- ── Resize handle ──────────────────────────────────────────────── -->
    <div class="resize-handle"></div>

    <!-- ── Right Panel: command + output ──────────────────────────────── -->
    <div class="right-panel">

      <div class="command-section">
        <div class="command-label">Command</div>
        <input
          type="text"
          id="command-input"
          class="command-input"
          placeholder="选择一个工具，或直接输入命令…"
          autocomplete="off"
          spellcheck="false"
        >
        <div class="cwd-row">
          <label class="cwd-label" for="cwd-input">Dir</label>
          <input type="text" id="cwd-input" class="cwd-input"
            placeholder="工作目录（留空=系统默认）"
            autocomplete="off" spellcheck="false">
          <button class="btn-save-cmd hidden" id="btn-save-cmd" title="保存修改（Ctrl+S）">✓ Save</button>
        </div>
        <div class="command-buttons">
          <button class="btn-start" id="btn-start" disabled>Start</button>
          <button class="btn-stop"  id="btn-stop"  disabled>Stop</button>
        </div>
      </div>

      <div class="output-section">
        <div class="output-header">
          <div class="output-tabs" id="output-tabs"></div>
          <button class="btn-clear" id="btn-clear-output" title="清空输出">Clear</button>
        </div>
        <div class="output-area" id="output-area">
          <span class="output-placeholder">shell output after command executed</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Modal: Add / Edit tool ─────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Add Tool</h2>
        <button class="btn-icon" id="btn-close-modal" title="关闭">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="tool-name">名称</label>
          <input type="text" id="tool-name" placeholder="工具名称" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="tool-description">描述</label>
          <textarea id="tool-description" rows="2" placeholder="简短描述（可选）"></textarea>
        </div>
        <div class="form-group">
          <label for="tool-command">命令</label>
          <input type="text" id="tool-command" placeholder="例如：npm start、python app.py" autocomplete="off" spellcheck="false">
        </div>
        <div class="form-group form-group--mono">
          <label for="tool-cwd">工作目录（cwd）</label>
          <input type="text" id="tool-cwd" placeholder="留空则使用系统默认目录" autocomplete="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label for="tool-group">分组</label>
          <input type="text" id="tool-group" placeholder="分组名称（可选）" autocomplete="off" list="group-datalist">
          <datalist id="group-datalist"></datalist>
        </div>
        <div class="form-group">
          <div class="env-header">
            <label>环境变量</label>
            <button type="button" class="btn-add-env" id="btn-add-env">+ 添加</button>
          </div>
          <div class="env-table" id="env-table"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel">取消</button>
        <button class="btn-primary"   id="btn-save">保存</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
